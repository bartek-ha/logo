<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Imkervereniging Delft e.o. Logo Examples</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.5;
    }

    h1, h2 {
      text-align: center;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 30px;
      margin-top: 30px;
    }

    figure {
      margin: 0;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 12px;
      text-align: center;
      background: #f8f8f8;
    }

    figure.dark {
      background: #1E3A8A;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    figcaption {
      margin-top: 15px;
      font-size: 14px;
      color: #333;
    }

    figure.dark figcaption {
      color: white;
    }
  </style>
</head>

<body>

  <h1>Imkervereniging Delft e.o. – Logo Examples</h1>

  <p>
    This page shows examples of the official logo in SVG and PNG format,
    including blue, black and white versions.
  </p>

  <h2>SVG logos</h2>

  <div class="gallery">

    <figure class="dark">
      <img src="assets/svg/Logo_white.svg" width="256" alt="White SVG logo">
      <figcaption>
        SVG logo — white — RGB #FFFFFF — scalable vector
      </figcaption>
    </figure>

    <figure>
      <img src="assets/svg/Logo_blue.svg" width="256" alt="Blue SVG logo">
      <figcaption>
        SVG logo — blue — RGB #1E3A8A — scalable vector
      </figcaption>
    </figure>

    <figure>
      <img src="assets/svg/Logo_black.svg" width="256" alt="Black SVG logo">
      <figcaption>
        SVG logo — black — RGB #000000 — scalable vector
      </figcaption>
    </figure>

  </div>

  <h2>PNG logos</h2>

  <div class="gallery">

    <figure>
      <img src="assets/png/Logo_rgb_blue_transparant_512x512.png" width="256" alt="Blue PNG logo 512 x 512">
      <figcaption>
        PNG logo — blue — RGB #1E3A8A — 512 × 512 pixels — transparent background
      </figcaption>
    </figure>

    <figure>
      <img src="assets/png/Logo_rgb_blue_transparant_128x128.png" width="128" alt="Blue PNG logo 128 x 128">
      <figcaption>
        PNG logo — blue — RGB #1E3A8A — 128 × 128 pixels — transparent background
      </figcaption>
    </figure>

    <figure class="dark">
      <img src="assets/png/Logo_rgb_white_transparant_256x256.png" width="256" alt="White PNG logo 256 x 256">
      <figcaption>
        PNG logo — white — RGB #FFFFFF — 256 × 256 pixels — transparent, background #1E3A8A
      </figcaption>
    </figure>

  </div>

</body>
</html>
